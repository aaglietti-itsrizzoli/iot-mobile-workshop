name: Deploy Expo web to Pages
on:
  push:
    branches: [master]
    paths: ["iot-bottle-web/**", ".github/workflows/expo2pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
        working-directory: iot-bottle-web
      - run: npx expo export -p web
        working-directory: iot-bottle-web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: iot-bottle-web/dist
      - uses: actions/deploy-pages@v4
